    <h1>Agriculture Map Project 
        Name: Kuvuna - to harvest
    </h1>
    <div id="map"></div>
    <script>
        const map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([-95, 39]), // Center on US
                zoom: 4
            })
        });

        const vectorSource = new ol.source.Vector({
            url: './congSimple.geojson',
            format: new ol.format.GeoJSON()
        });

        const vectorLayer = new ol.layer.Vector({
            source: vectorSource
        });

        map.addLayer(vectorLayer);
    </script>

<div id="tooltip" style="position: absolute; background: white; border: 1px solid black; padding: 5px; display: none; pointer-events: none;"></div>
<script>
const tooltip = document.getElementById('tooltip');
let hoveredFeature = null;

const tooltipObserver = new MutationObserver(() => {
    if (!hoveredFeature || tooltip.style.display === 'none') return;

    const photoUrl = hoveredFeature.get('PHOTOURL');
let container = tooltip.querySelector('#photo-container');
let img = container ? container.querySelector('img') : null;

if (photoUrl && container) {
    if (!img) {
        img = document.createElement('img');
        img.style.maxWidth = '220px';
        img.style.maxHeight = '150px';
        img.style.display = 'block';
        container.appendChild(img);
    }
    img.src = photoUrl;
    img.alt = 'District photo';
} else if (img) {
    img.remove();
}
});

tooltipObserver.observe(tooltip, { childList: true, subtree: true });

map.on('pointermove', function(evt) {
    const feature = map.forEachFeatureAtPixel(evt.pixel, function(feature) {
        return feature;
    });

    hoveredFeature = feature || null;

    if (feature) {
        const name = feature.get('NAMELSAD') || '';
        const first = feature.get('FIRSTNAME') || '';
        const last = feature.get('LASTNAME') || '';

        const firstCrop = feature.get('First Crop') || '';
        const firstValue = (feature.get('First Value') || 0).toLocaleString();
        const secondCrop = feature.get('Second Crop') || '';
        const secondValue = (feature.get('Second Value') || 0).toLocaleString();
        const thirdCrop = feature.get('Third Crop') || '';
        const thirdValue = (feature.get('Third Value') || 0).toLocaleString();
        const fourthCrop = feature.get('Fourth Crop') || '';
        const fourthValue = (feature.get('Fourth Value') || 0).toLocaleString();
        const fifthCrop = feature.get('Fifth Crop') || '';
        const fifthValue = (feature.get('Fifth Value') || 0).toLocaleString();
        tooltip.innerHTML = `
    <div>
        <!-- Top section (above photo) -->
        <div style="margin-bottom: 6px;">
            <strong>${name}</strong><br/>
            ${first} ${last}
        </div>

        <!-- Bottom section (photo left, land use right) -->
        <div style="display: flex; align-items: flex-start; gap: 10px;">
            
            <div id="photo-container"></div>

            <div>
                <strong>Land Use:</strong><br/>
                1st ${firstCrop}: ${firstValue} acres<br/>
                2nd ${secondCrop}: ${secondValue} acres<br/>
                3rd ${thirdCrop}: ${thirdValue} acres<br/>
                4th ${fourthCrop}: ${fourthValue} acres<br/>
                5th ${fifthCrop}: ${fifthValue} acres
            </div>

        </div>
    </div>
`;

        tooltip.style.display = 'block';
        tooltip.style.left = (evt.pixel[0] + 10) + 'px';
        tooltip.style.top = (evt.pixel[1] + 10) + 'px';
    } else {
        tooltip.style.display = 'none';
    }
});
</script>

  "53": "Washington",
  "54": "West Virginia",
  "55": "Wisconsin",
  "56": "Wyoming"
};let data = [];

// Load your JSON file
fetch('congretionalCrops.json')
  .then(response => response.json())
  .then(json => {
    data = json;
    updateResults("Corn"); // default selection
  })
  .catch(err => console.error("Error loading JSON:", err));

// Listen for dropdown change
document.getElementById("cropSelect").addEventListener("change", function() {
  updateResults(this.value);
});

function updateResults(crop) {
  if (!data.length) return;

  // Sort by selected crop (highest first)
  let sorted = [...data].sort((a, b) => (parseFloat(b[crop]) || 0) - (parseFloat(a[crop]) || 0));

  // Take top 5
  let top5 = sorted.slice(0, 5);

  let container = document.getElementById("results");
  container.innerHTML = "";

  const ranks = ["First", "Second", "Third", "Fourth", "Fifth"];

  top5.forEach((person, index) => {
    let div = document.createElement("div");
    div.style.marginBottom = "20px";

    let stateName = STATEFP_TO_NAME[String(person.STATEFP).padStart(2, "0")];

    let title = `${person.FIRSTNAME} ${person.LASTNAME} of ${stateName}'s ${person.NAMELSAD}`;

    div.innerHTML = `
      <p><strong>${ranks[index]}:</strong> ${title}</p>
      <img src="${person.PHOTOURL}" width="100" alt="photo"/>
      <p>${person[crop].toLocaleString()} acres of ${crop}</p>
      <hr>
    `;

    container.appendChild(div);
  });
}
